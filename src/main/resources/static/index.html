<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F1524">
  <title>שכנים</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen">

  <header>
    <h1 class="greeting" id="greeting">טוב שבאת</h1>
    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <div class="street">
    <!-- The windows are added by app.js. Decorative: the count line says the same in words. -->
    <div class="building" id="building" aria-hidden="true">
      <div class="door"></div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="here-button" id="here-button">אני כאן</button>
    <p class="note" id="here-note">אין צורך לדבר עם אף אחד. רק להיות.</p>
  </div>

  <a class="help" href="help.html">צריך לדבר עם מישהו עכשיו?</a>

</main>
<script src="app.js"></script>
</body>
</html>
