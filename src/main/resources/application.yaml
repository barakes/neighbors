spring:
  application:
    name: neighbors

  # The database. The values come only from environment variables (IntelliJ, Render),
  # never from this file. Empty defaults let the tests start: they bring their own database.
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # Flyway creates the tables; Hibernate only checks that the code matches them.
      ddl-auto: validate
    # Database connections are used only inside the code that needs them, not while a page is sent.
    open-in-view: false

server:
  # Render tells the server which port to use in PORT. On your computer it's 8080.
  port: ${PORT:8080}

limits:
  # Where the real address of whoever sends a request comes from. Render sits behind Cloudflare,
  # which writes CF-Connecting-IP itself and refuses requests that try to send it (checked on
  # PlainLetter's live server). Without the header (on your computer), the connection's own address is used.
  client-ip-header: CF-Connecting-IP

ladder:
  # The AES key that encrypts the ladder steps people write. Comes only from the environment variable.
  # Base64 of 32 random bytes. Losing it makes every saved ladder unreadable, so keep a copy somewhere safe.
  key: ${LADDER_KEY:}
