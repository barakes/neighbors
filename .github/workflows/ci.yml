name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The tests start a real PostgreSQL with Testcontainers; GitHub's runners already have Docker.
      - name: Run the tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
